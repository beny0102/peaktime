name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # macos-14/13 are retired labels. macos-15 is a currently supported
    # arm64 runner and matches the architecture of the release artifact.
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build and sign the app
        run: ./build.sh
