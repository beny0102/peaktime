name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build and sign the app
        run: ./build.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: peaktime
          path: dist/peaktime.app
