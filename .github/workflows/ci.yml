name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # macos-14 maps to an arm64 runner that is not available for this account.
    # macos-13 (Intel) is supported and is enough to validate build and tests.
    runs-on: macos-13
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build and sign the app
        run: ./build.sh
